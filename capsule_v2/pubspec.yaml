name: capsule_v2
description: Capsule 2.0 - Transform web apps into desktop applications with a simple GUI
version: 2.0.0-alpha
publish_to: none

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # UI Components
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  
  # File & Storage
  path_provider: ^2.1.1
  path: ^1.8.3
  sqflite: ^2.3.0
  shared_preferences: ^2.2.2
  
  # WebView & Preview
  webview_flutter: ^4.4.2
  webview_flutter_platform_interface: ^2.8.0
  
  # Build & Compression
  archive: ^3.4.9
  image: ^4.1.3
  
  # Platform Integration
  window_manager: ^0.3.7
  tray_manager: ^0.2.1
  
  # Utilities
  uuid: ^4.2.1
  intl: ^0.18.1
  dio: ^5.4.0
  logger: ^2.0.2
  file_picker: ^6.1.1
  permission_handler: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mockito: ^5.4.4
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/templates/
    
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
