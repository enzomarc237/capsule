name: Build and Release Capsule 2.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # macOS builds
          - os: macos-13
            platform: macos
            arch: x64
            artifact: capsule_macos_x64
          - os: macos-14
            platform: macos
            arch: arm64
            artifact: capsule_macos_arm64
          # Linux builds
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact: capsule_linux_x64
          # Windows builds
          - os: windows-latest
            platform: windows
            arch: x64
            artifact: capsule_windows_x64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Get dependencies
        run: dart pub get

      - name: Verify build system
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test || echo "No tests defined yet"
        continue-on-error: true

      - name: Build Capsule 2.0
        run: dart compile exe bin/capsule_v2.dart -o ${{ matrix.artifact }}

      - name: Test executable (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x ${{ matrix.artifact }}
          ./${{ matrix.artifact }} --help

      - name: Test executable (Windows)
        if: runner.os == 'Windows'
        run: |
          .\${{ matrix.artifact }} --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create checksums
        run: |
          cd artifacts
          for dir in */; do
            cd "$dir"
            for file in *; do
              sha256sum "$file" > "${file}.sha256"
            done
            cd ..
          done

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: true
          generate_release_notes: true
          body: |
            # Capsule 2.0 - Desktop App Bundler

            Transform web applications into standalone desktop executables with ease!

            ## 🚀 What's New in 2.0

            - **6-Stage Build Pipeline**: Validation → Preparation → Code Generation → Compilation → Packaging → Verification
            - **Enhanced Architecture**: Modular design with clear separation of concerns
            - **Rich CLI Experience**: Beautiful progress tracking and detailed build logs
            - **Improved Asset Processing**: Optimized compression and encoding
            - **Platform Abstraction**: Better support for cross-platform builds

            ## 📦 Downloads

            Choose the appropriate binary for your platform:

            - **macOS Intel (x64)**: `capsule_macos_x64`
            - **macOS Apple Silicon (ARM64)**: `capsule_macos_arm64`
            - **Linux (x64)**: `capsule_linux_x64`
            - **Windows (x64)**: `capsule_windows_x64.exe`

            ## 🔐 Verification

            SHA256 checksums are provided for each binary (`.sha256` files).

            ## 📖 Usage

            ```bash
            # Basic usage
            ./capsule_macos_x64 -i ./my-web-app

            # With custom output and name
            ./capsule_macos_x64 -i ./dist -o ./build -n "My App"

            # Verbose output
            ./capsule_macos_x64 -i ./dist -v
            ```

            ## 📚 Documentation

            Full documentation is available in the repository.

            ## 🐛 Known Issues

            None reported yet. Please report any issues on GitHub.

            ---

            **Built with ❤️ using Dart**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM dart:stable AS build

          WORKDIR /app
          COPY pubspec.yaml pubspec.yaml
          RUN dart pub get

          COPY . .
          RUN dart compile exe bin/capsule_v2.dart -o capsule

          FROM debian:bookworm-slim

          RUN apt-get update && apt-get install -y ca-certificates && rm -rf /var/lib/apt/lists/*

          COPY --from=build /app/capsule /usr/local/bin/capsule

          ENTRYPOINT ["/usr/local/bin/capsule"]
          CMD ["--help"]
          EOF

      - name: Build Docker image
        run: |
          docker build -t capsule:latest .
          docker save capsule:latest | gzip > capsule_docker_image.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: capsule_docker_image
          path: capsule_docker_image.tar.gz
          retention-days: 7
