name: Build and Release Capsule 2.1+

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'claude/continue-v21-plus-development'
  workflow_dispatch:

jobs:
  build-cli:
    name: Build CLI ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # macOS builds
          - os: macos-13
            platform: macos
            arch: x64
            artifact: capsule_cli_macos_x64
          - os: macos-14
            platform: macos
            arch: arm64
            artifact: capsule_cli_macos_arm64
          # Linux builds
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact: capsule_cli_linux_x64
          # Windows builds
          - os: windows-latest
            platform: windows
            arch: x64
            artifact: capsule_cli_windows_x64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Get dependencies
        run: dart pub get

      - name: Verify build system
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test || echo "No tests defined yet"
        continue-on-error: true

      - name: Build Capsule 2.0 CLI
        run: dart compile exe bin/capsule_v2.dart -o ${{ matrix.artifact }}

      - name: Test executable (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x ${{ matrix.artifact }}
          ./${{ matrix.artifact }} --help

      - name: Test executable (Windows)
        if: runner.os == 'Windows'
        run: |
          .\${{ matrix.artifact }} --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  build-flutter-gui:
    name: Build Flutter GUI ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # macOS builds
          - os: macos-13
            platform: macos
            artifact: capsule_gui_macos_x64
            flutter_build: flutter build macos --release
          - os: macos-14
            platform: macos
            artifact: capsule_gui_macos_arm64
            flutter_build: flutter build macos --release
          # Linux builds
          - os: ubuntu-latest
            platform: linux
            artifact: capsule_gui_linux_x64
            flutter_build: flutter build linux --release
          # Windows builds
          - os: windows-latest
            platform: windows
            artifact: capsule_gui_windows_x64
            flutter_build: flutter build windows --release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Flutter GUI
        working-directory: flutter_app
        run: ${{ matrix.flutter_build }}

      - name: Package Linux build
        if: runner.os == 'Linux'
        working-directory: flutter_app/build/linux/x64/release/bundle
        run: |
          tar -czf ../../../../../${{ matrix.artifact }}.tar.gz *

      - name: Package macOS build
        if: runner.os == 'macOS'
        working-directory: flutter_app/build/macos/Build/Products/Release
        run: |
          zip -r ../../../../../${{ matrix.artifact }}.zip capsule_gui.app

      - name: Package Windows build
        if: runner.os == 'Windows'
        working-directory: flutter_app/build/windows/x64/runner/Release
        run: |
          Compress-Archive -Path * -DestinationPath ../../../../../${{ matrix.artifact }}.zip

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: flutter_app/${{ matrix.artifact }}.tar.gz
          retention-days: 7

      - name: Upload artifact (macOS/Windows)
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: flutter_app/${{ matrix.artifact }}.zip
          retention-days: 7

  create-release:
    name: Create Release Draft
    needs: [build-cli, build-flutter-gui]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create checksums
        run: |
          cd artifacts
          for dir in */; do
            cd "$dir"
            for file in *; do
              sha256sum "$file" > "${file}.sha256"
            done
            cd ..
          done

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release/

      - name: Create Release Draft
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: true
          generate_release_notes: true
          body: |
            # Capsule 2.1+ - Desktop App Bundler with Flutter GUI 🚀

            Transform web applications into standalone desktop executables with a beautiful graphical interface!

            ## ✨ What's New in 2.1+

            ### 🎨 Flutter GUI Application (NEW!)
            - **Native Desktop Interface**: Beautiful cross-platform GUI built with Flutter
            - **Live Preview Window**: See your web app in real-time with integrated WebView
            - **Drag & Drop**: Easy project import and configuration
            - **Visual Build Progress**: Watch the 6-stage pipeline with detailed logging
            - **Multi-Platform Configuration**: Select and build for multiple targets simultaneously
            - **Modern UI/UX**: Clean, professional interface following Material Design

            ### 🔧 CLI Enhancements (v2.0 Foundation)
            - **6-Stage Build Pipeline**: Validation → Preparation → Code Generation → Compilation → Packaging → Verification
            - **Enhanced Architecture**: Modular design with clear separation of concerns
            - **Rich CLI Experience**: Beautiful progress tracking and detailed build logs
            - **Improved Asset Processing**: Optimized compression and encoding
            - **Platform Abstraction**: Better support for cross-platform builds

            ## 📦 Downloads

            ### 🖥️ GUI Application (Recommended for most users)
            - **macOS Intel (x64)**: `capsule_gui_macos_x64.zip`
            - **macOS Apple Silicon (ARM64)**: `capsule_gui_macos_arm64.zip`
            - **Linux (x64)**: `capsule_gui_linux_x64.tar.gz`
            - **Windows (x64)**: `capsule_gui_windows_x64.zip`

            ### ⌨️ CLI Tool (For automation and advanced users)
            - **macOS Intel (x64)**: `capsule_cli_macos_x64`
            - **macOS Apple Silicon (ARM64)**: `capsule_cli_macos_arm64`
            - **Linux (x64)**: `capsule_cli_linux_x64`
            - **Windows (x64)**: `capsule_cli_windows_x64.exe`

            ## 🔐 Verification

            SHA256 checksums are provided for all binaries (`.sha256` files).

            ## 📖 Usage

            ### GUI Application
            ```bash
            # Extract and run the GUI application
            # macOS
            unzip capsule_gui_macos_x64.zip
            open capsule_gui.app

            # Linux
            tar -xzf capsule_gui_linux_x64.tar.gz
            ./capsule_gui

            # Windows
            # Extract the ZIP and double-click capsule_gui.exe
            ```

            ### CLI Tool
            ```bash
            # Basic usage
            ./capsule_cli_macos_x64 -i ./my-web-app

            # With custom output and name
            ./capsule_cli_macos_x64 -i ./dist -o ./build -n "My App"

            # Verbose output
            ./capsule_cli_macos_x64 -i ./dist -v
            ```

            ## 📚 Documentation

            Full documentation is available in the repository:
            - [README_V2.md](https://github.com/enzomarc237/capsule/blob/main/README_V2.md) - CLI documentation
            - [flutter_app/README.md](https://github.com/enzomarc237/capsule/blob/main/flutter_app/README.md) - GUI documentation
            - [CHANGELOG.md](https://github.com/enzomarc237/capsule/blob/main/CHANGELOG.md) - Complete changelog

            ## 🛣️ Roadmap

            ### Coming in v2.2
            - Auto-update mechanism for bundled applications
            - Code signing configuration UI
            - Template marketplace
            - Advanced build configurations

            ## 🐛 Known Issues

            - Flutter GUI is in beta - some features are still under development
            - Live preview may not work for all web frameworks
            - Please report issues on [GitHub Issues](https://github.com/enzomarc237/capsule/issues)

            ## 🙏 Acknowledgments

            Built with ❤️ using:
            - **Dart** for the build engine
            - **Flutter** for the GUI
            - **GitHub Actions** for CI/CD

            ---

            **Note**: This is an automated release draft. Please review and edit before publishing.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM dart:stable AS build

          WORKDIR /app
          COPY pubspec.yaml pubspec.yaml
          RUN dart pub get

          COPY . .
          RUN dart compile exe bin/capsule_v2.dart -o capsule

          FROM debian:bookworm-slim

          RUN apt-get update && apt-get install -y ca-certificates && rm -rf /var/lib/apt/lists/*

          COPY --from=build /app/capsule /usr/local/bin/capsule

          ENTRYPOINT ["/usr/local/bin/capsule"]
          CMD ["--help"]
          EOF

      - name: Build Docker image
        run: |
          docker build -t capsule:latest .
          docker save capsule:latest | gzip > capsule_docker_image.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: capsule_docker_image
          path: capsule_docker_image.tar.gz
          retention-days: 7
