name: capsule_gui
description: Capsule 2.1+ - GUI desktop application bundler with live preview and advanced features
publish_to: 'none'
version: 2.1.0+1

environment:
  sdk: '>=3.10.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1

  # File System & Platform
  file_picker: ^8.0.0+1
  path_provider: ^2.1.2
  path: ^1.9.1
  shared_preferences: ^2.2.2

  # WebView for Preview
  webview_flutter: ^4.7.0
  webview_flutter_web: ^0.2.2+4
  webview_flutter_wkwebview: ^3.13.0
  webview_flutter_android: ^3.16.0

  # HTTP & Networking
  http: ^1.2.0
  dio: ^5.4.2+1

  # Build & Asset Processing
  archive: ^3.4.10
  image: ^4.1.7
  mime: ^1.0.5
  crypto: ^3.0.3

  # Configuration & Data
  yaml: ^3.1.2
  uuid: ^4.3.3
  intl: ^0.19.0

  # Desktop Window Management
  window_manager: ^0.3.8

  # Auto-Update
  package_info_plus: ^6.0.0
  url_launcher: ^6.2.5

  # Logging
  logger: ^2.2.0

  # Code Signing
  process_run: ^0.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  integration_test:
    sdk: flutter
  test: ^1.25.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/templates/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
